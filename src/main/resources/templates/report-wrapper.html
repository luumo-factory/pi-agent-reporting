<div class="report-page" xmlns:th="http://www.thymeleaf.org">
  <header class="report-header">
    <div class="badge">report</div>
    <h1 th:text="${title}">Report Title</h1>
    <p class="meta">
      <strong>Date:</strong> <span th:text="${date}">2026-05-13</span> · 
      <strong>Owner:</strong> <span th:text="${owner}">Owner</span>
    </p>
  </header>
  <div class="report-section markdown-content" th:utext="${htmlContent}">
    <!-- Rendered markdown content goes here -->
  </div>
</div>
