<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pi Agent Reports</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/img/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/img/apple-touch-icon.png" />
  
  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#8b5cf6" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Pi Reports" />
  
  <link rel="stylesheet" href="/css/main.css" />

</head>
<body>
  <header id="main-header">
    <div class="header-brand">
      <div class="brand-logo">π</div>
      <div class="brand-text">
        <h1>Pi Agent Reports</h1>
        <p>Live report monitor</p>
      </div>
    </div>
    <div class="header-right">
      <div class="stats">
        <div>Updated: <span class="stat-value" id="last-update">just now</span></div>
      </div>

      <button id="bell-toggle" class="notification-toggle" type="button" 
              th:classappend="${notificationMode == 'bell' or notificationMode == 'tts'} ? 'active' : ''" 
              th:data-mode="${notificationMode}"
              title="Toggle notification mode">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
        </svg>
      </button>
      <button id="theme-toggle" class="theme-toggle" type="button" title="Toggle theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
      </button>
    </div>
  </header>
  <main>
    <aside>
      <div id="error-message" class="error-banner" hidden></div>
      <div class="project-filter">
        <select id="project-select" class="project-select">
          <option value="all">All Projects</option>
        </select>
        <button id="filter-clear" class="filter-clear" type="button" title="Clear filter" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div class="report-list" id="report-list">
        <div class="empty-state" th:if="${#lists.isEmpty(reports)}">No reports yet. Generate one and it will appear here.</div>
        <th:block th:unless="${#lists.isEmpty(reports)}">
          <article th:class="'report ' + (${report.read} ? 'read' : 'unread') + (${report.flagged} ? ' flagged' : '')"
                   th:each="report : ${reports}"
                   th:data-report="${report.filename}"
                   th:data-timestamp="${report.timestampISO}"
                   th:data-project="${report.project}"
                   th:classappend="${currentReport != null and currentReport == report.filename} ? 'active' : ''">
            <div class="envelope-wrap" th:attr="data-state=${report.read ? 'read' : 'unread'}">
              <svg class="envelope-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   th:attr="stroke-width=${report.read ? '1.8' : '2.2'}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect th:if="${report.read}" x="2" y="8" width="20" height="12" rx="2"/>
                <path th:if="${report.read}" d="m22 8-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 8"/>
                <path th:if="${report.read}" d="M7 8V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v3"/>
                <rect th:unless="${report.read}" x="2" y="4" width="20" height="16" rx="2"/>
                <path th:unless="${report.read}" d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
              </svg>
            </div>
            <div class="report-info">
              <p class="report-title" th:text="${report.title}">Report title</p>
              <p class="report-meta" th:attr="data-timestamp=${report.timestampISO}"></p>
              <span class="report-project" th:classappend="${report.project}" th:text="${report.project}" th:attr="data-project=${report.project}" th:title="${report.filename}">global</span>
            </div>
            <div class="report-actions">
              <button class="action-btn read-toggle" th:attr="data-report=${report.filename}" type="button" title="Toggle read/unread">
                <span th:text="${report.read} ? '✓' : '•'">•</span>
              </button>
              <button th:class="'action-btn flag-toggle' + (${report.flagged} ? ' flagged' : '')" th:attr="data-report=${report.filename}" type="button" title="Toggle flag">
                <span>🚩</span>
              </button>
            </div>
          </article>
        </th:block>
      </div>
      <div class="resize-handle" id="resize-handle"></div>
    </aside>
    <section class="viewer">
      <header>
        <div class="status-line">
          Viewing: <strong id="active-report" th:text="${#lists.isEmpty(reports)} ? 'None' : ${reports[0].displayName}" th:attr="data-full-path=${#lists.isEmpty(reports)} ? '' : ${reports[0].filename}">None</strong>
          <span id="loading-indicator" class="spinner" style="display: none;"></span>
        </div>
        <button id="toggle-raw" class="secondary" type="button" style="display: none;">Show Markdown</button>
      </header>
      <div class="viewer-content">
        <div id="rendered-content" class="content-wrapper">
          <div class="empty-state" th:if="${#lists.isEmpty(reports)}">Select a report to view</div>
        </div>
        <div id="raw-content" class="content-wrapper raw-markdown hidden"></div>
      </div>
    </section>
  </main>

  <!-- SVG icons stored as inert templates for dynamic list updates -->
  <template id="icon-unread">
    <svg class="envelope-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="2" y="4" width="20" height="16" rx="2"/>
      <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
    </svg>
  </template>

  <template id="icon-read">
    <svg class="envelope-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="2" y="8" width="20" height="12" rx="2"/>
      <path d="m22 8-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 8"/>
      <path d="M7 8V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v3"/>
    </svg>
  </template>

  <footer class="site-footer">
    <div class="footer-content">
      <p class="footer-brand">
        Pi Agent Reports - brought to you with ❤️ by <a href="https://luumo.ai" target="_blank" rel="noopener noreferrer">Luumo Factory</a>.
      </p>
      <p class="footer-meta">
        &copy; 2026 Luumo Factory Limited.
        <span class="footer-build">Build <span th:text="${gitCommitId}">unknown</span></span>
      </p>
    </div>
  </footer>

  <script defer src="/js/main.js"></script>
</body>
</html>
