<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pi Agent Reports</title>
  <link rel="stylesheet" href="/css/report-theme.css" />
  <style>
    :root {
      color-scheme: light;
      --bg: #f3f4f6;
      --fg: #111827;
      --accent: #2563eb;
      --accent-muted: #93c5fd;
      --border: #d1d5db;
      --danger: #dc2626;
      --muted: #4b5563;
      --panel-bg: rgba(255, 255, 255, 0.85);
      --card-hover: rgba(37, 99, 235, 0.08);
      --card-active: rgba(37, 99, 235, 0.15);
      --pulse-glow: rgba(37, 99, 235, 0.45);
      --pulse-bg: rgba(37, 99, 235, 0.07);
      --raw-bg: #1e1e1e;
      --raw-fg: #d4d4d4;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    body[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0f172a;
      --fg: #f8fafc;
      --accent: #60a5fa;
      --accent-muted: #1d4ed8;
      --border: #1e293b;
      --danger: #f87171;
      --muted: #94a3b8;
      --panel-bg: rgba(15, 23, 42, 0.75);
      --card-hover: rgba(96, 165, 250, 0.2);
      --card-active: rgba(96, 165, 250, 0.35);
      --pulse-glow: rgba(96, 165, 250, 0.5);
      --pulse-bg: rgba(96, 165, 250, 0.12);
      --raw-bg: #0a0a0a;
      --raw-fg: #e5e5e5;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--fg);
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      padding: 1rem 1.75rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1rem;
      background: var(--panel-bg);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      position: sticky;
      top: 0;
      z-index: 10;
      transition: background 0.3s ease;
    }

    @keyframes header-pulse {
      0%   { box-shadow: none; background-color: var(--panel-bg); }
      20%  { box-shadow: 0 0 0 3px var(--pulse-glow), inset 0 0 0 9999px var(--pulse-bg); background-color: var(--pulse-bg); }
      60%  { box-shadow: 0 0 0 6px color-mix(in srgb, var(--pulse-glow) 20%, transparent); }
      100% { box-shadow: none; background-color: var(--panel-bg); }
    }

    header.pulsing {
      animation: header-pulse 1.4s ease-out forwards;
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      flex: 1;
    }

    .brand-logo {
      width: 2.4rem;
      height: 2.4rem;
      border-radius: 0.65rem;
      background: var(--accent);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.35rem;
      font-weight: 700;
      font-style: italic;
      letter-spacing: -0.05em;
      flex-shrink: 0;
      box-shadow: 0 4px 12px color-mix(in srgb, var(--accent) 40%, transparent);
      user-select: none;
    }

    .brand-text h1 {
      font-size: 1.3rem;
      font-weight: 700;
      margin: 0;
      letter-spacing: -0.02em;
    }

    .brand-text p {
      margin: 0;
      font-size: 0.78rem;
      color: var(--muted);
      letter-spacing: 0.01em;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      flex-wrap: wrap;
    }

    .stats {
      display: flex;
      gap: 1.25rem;
      flex-wrap: wrap;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .stats .stat-value {
      font-weight: 600;
      color: var(--fg);
    }

    /* ── Layout ── */
    main {
      flex: 1;
      display: grid;
      grid-template-columns: minmax(240px, 320px) 1fr;
      min-height: 0;
    }

    aside {
      border-right: 1px solid var(--border);
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    /* ── Buttons ── */
    button {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 0.5rem;
      padding: 0.5rem 0.9rem;
      font-size: 0.875rem;
      cursor: pointer;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    button.secondary {
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--accent);
    }

    button:hover:not(:disabled) {
      box-shadow: 0 4px 12px color-mix(in srgb, var(--accent) 35%, transparent);
      transform: translateY(-1px);
    }

    /* ── Report list ── */
    .report-list {
      flex: 1;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      background: var(--panel-bg);
      padding: 0.25rem;
    }

    .report {
      border-radius: 0.6rem;
      padding: 0.55rem 0.75rem;
      cursor: pointer;
      margin: 0.25rem 0.2rem;
      transition: background 0.15s ease, transform 0.1s ease;
      border: 1px solid transparent;
      display: flex;
      align-items: center;
      gap: 0.65rem;
    }

    .report:hover {
      background: var(--card-hover);
    }

    .report.active {
      background: var(--card-active);
      border-color: var(--accent-muted);
      transform: translateX(2px);
    }

    .report.flagged {
      background: rgba(220, 38, 38, 0.08);
      border-left: 3px solid var(--danger);
    }

    .report-actions {
      display: flex;
      gap: 0.3rem;
      align-items: center;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .report:hover .report-actions {
      opacity: 1;
    }

    .action-btn {
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 0.2rem;
      color: var(--muted);
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s ease;
    }

    .action-btn:hover {
      color: var(--accent);
    }

    .action-btn.flagged {
      color: var(--danger);
    }

    /* ── Envelope icon ── */
    .envelope-wrap {
      flex-shrink: 0;
      width: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .envelope-icon {
      width: 1.05rem;
      height: 1.05rem;
      display: block;
      transition: color 0.2s ease, opacity 0.2s ease;
    }

    .report.unread .envelope-icon {
      color: var(--accent);
    }

    .report.read .envelope-icon {
      color: var(--muted);
      opacity: 0.65;
    }

    /* ── Report text ── */
    .report-info {
      min-width: 0;
      flex: 1;
    }

    .report-title {
      margin: 0;
      font-size: 0.88rem;
      word-break: break-word;
      line-height: 1.3;
      transition: font-weight 0.15s ease, color 0.15s ease;
    }

    .report.unread .report-title {
      font-weight: 650;
      color: var(--fg);
    }

    .report.read .report-title {
      font-weight: 400;
      color: var(--muted);
    }

    .report.active.read .report-title {
      color: var(--fg);
    }

    .report-meta {
      margin: 0.2rem 0 0;
      font-size: 0.75rem;
      color: var(--muted);
    }

    /* ── Viewer ── */
    section.viewer {
      min-height: 0;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    section.viewer > header {
      border: none;
      border-bottom: 1px solid var(--border);
      padding: 0.75rem 1.5rem;
      position: relative;
      top: auto;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      animation: none !important;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .viewer-content {
      flex: 1;
      overflow-y: auto;
      position: relative;
      background: var(--bg);
    }

    .content-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      min-height: 100%;
      padding: 2rem;
      opacity: 1;
      transform: translateY(0);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .content-wrapper.loading {
      opacity: 0;
      transform: translateY(10px);
    }

    .content-wrapper.hidden {
      display: none;
    }

    /* Raw markdown view */
    .raw-markdown {
      background: var(--raw-bg);
      color: var(--raw-fg);
      padding: 2rem;
      font-family: 'Courier New', monospace;
      font-size: 0.9rem;
      line-height: 1.6;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .empty-state {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 1rem;
      padding: 2rem;
      text-align: center;
    }

    .status-line {
      font-size: 0.85rem;
      color: var(--muted);
    }

    .status-line strong {
      color: var(--fg);
    }

    .error-banner {
      color: var(--danger);
      font-size: 0.85rem;
      margin-top: 0.3rem;
    }

    .theme-toggle {
      background: transparent;
      color: var(--fg);
      border: 1px solid var(--border);
    }

    .theme-toggle:hover {
      background: var(--card-hover);
    }

    .notification-toggle {
      background: transparent;
      color: var(--fg);
      border: 1px solid var(--border);
      padding: 0.5rem;
      width: 2.5rem;
      height: 2.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .notification-toggle:hover {
      background: var(--card-hover);
    }

    .notification-toggle.active {
      color: var(--accent);
      border-color: var(--accent);
    }

    .notification-toggle svg {
      width: 1.2rem;
      height: 1.2rem;
    }

    /* New report highlight */
    @keyframes highlight-new {
      0% {
        background: rgba(34, 197, 94, 0.3);
        border-color: rgba(34, 197, 94, 0.6);
      }
      100% {
        background: transparent;
        border-color: transparent;
      }
    }

    .report.new-highlight {
      animation: highlight-new 30s ease-out forwards;
    }

    /* Loading spinner */
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .spinner {
      display: inline-block;
      width: 1rem;
      height: 1rem;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin-left: 0.5rem;
    }

    @media (max-width: 900px) {
      main {
        grid-template-columns: 1fr;
      }

      aside {
        border-right: none;
        border-bottom: 1px solid var(--border);
      }
    }
  </style>
</head>
<body>
  <header id="main-header">
    <div class="header-brand">
      <div class="brand-logo">π</div>
      <div class="brand-text">
        <h1>Pi Agent Reports</h1>
        <p>Live report monitor</p>
      </div>
    </div>
    <div class="header-right">
      <div class="stats">
        <div>Total: <span class="stat-value" id="report-count" th:text="${#lists.size(reports)}">0</span></div>
        <div>Updated: <span class="stat-value" id="last-update">just now</span></div>
      </div>
      <button id="auto-read-toggle" class="secondary" type="button" th:classappend="${autoReadEnabled} ? 'active' : ''" title="Toggle auto-read latest report">
        <span th:text="${autoReadEnabled} ? '🔄 Auto' : '⏸ Manual'">Manual</span>
      </button>
      <button id="bell-toggle" class="secondary" type="button" th:classappend="${bellEnabled} ? 'active' : ''" title="Toggle notification sound">
        <span th:text="${bellEnabled} ? '🔔 Bell' : '🔕 Muted'">Bell</span>
      </button>
      <button id="theme-toggle" class="secondary theme-toggle" type="button">Dark mode</button>
    </div>
  </header>
  <main>
    <aside>
      <div id="error-message" class="error-banner" hidden></div>
      <div class="report-list" id="report-list">
        <div class="empty-state" th:if="${#lists.isEmpty(reports)}">No reports yet. Generate one and it will appear here.</div>
        <th:block th:unless="${#lists.isEmpty(reports)}">
          <article th:class="'report ' + (${report.read} ? 'read' : 'unread') + (${report.flagged} ? ' flagged' : '')" 
                   th:each="report : ${reports}" 
                   th:data-report="${report.filename}"
                   th:data-timestamp="${report.timestampISO}"
                   th:classappend="${currentReport != null and currentReport == report.filename} ? 'active' : ''">
            <div class="envelope-wrap" th:attr="data-state=${report.read ? 'read' : 'unread'}">
              <svg class="envelope-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   th:attr="stroke-width=${report.read ? '1.8' : '2.2'}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect th:if="${report.read}" x="2" y="8" width="20" height="12" rx="2"/>
                <path th:if="${report.read}" d="m22 8-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 8"/>
                <path th:if="${report.read}" d="M7 8V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v3"/>
                <rect th:unless="${report.read}" x="2" y="4" width="20" height="16" rx="2"/>
                <path th:unless="${report.read}" d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
              </svg>
            </div>
            <div class="report-info">
              <p class="report-title" th:text="${report.title}">Report title</p>
              <p class="report-meta" th:attr="data-type=${report.type}">Loading...</p>
            </div>
            <div class="report-actions">
              <button class="action-btn read-toggle" th:attr="data-report=${report.filename}" type="button" title="Toggle read/unread">
                <span th:text="${report.read} ? '✓' : '•'">•</span>
              </button>
              <button th:class="'action-btn flag-toggle' + (${report.flagged} ? ' flagged' : '')" th:attr="data-report=${report.filename}" type="button" title="Toggle flag">
                <span>🚩</span>
              </button>
            </div>
          </article>
        </th:block>
      </div>
    </aside>
    <section class="viewer">
      <header>
        <div class="status-line">
          Viewing: <strong id="active-report" th:text="${#lists.isEmpty(reports)} ? 'None' : ${reports[0].filename}">None</strong>
          <span id="loading-indicator" class="spinner" style="display: none;"></span>
        </div>
        <button id="toggle-raw" class="secondary" type="button" style="display: none;">Show Raw</button>
      </header>
      <div class="viewer-content">
        <div id="rendered-content" class="content-wrapper">
          <div class="empty-state" th:if="${#lists.isEmpty(reports)}">Select a report to view</div>
        </div>
        <div id="raw-content" class="content-wrapper raw-markdown hidden"></div>
      </div>
    </section>
  </main>

  <!-- SVG icons stored as inert templates for dynamic list updates -->
  <template id="icon-unread">
    <svg class="envelope-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="2" y="4" width="20" height="16" rx="2"/>
      <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
    </svg>
  </template>

  <template id="icon-read">
    <svg class="envelope-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="2" y="8" width="20" height="12" rx="2"/>
      <path d="m22 8-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 8"/>
      <path d="M7 8V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v3"/>
    </svg>
  </template>

  <script th:inline="javascript">
    const THEME_CHANGE_EVENT = 'reports-theme-change';

    class NotificationSound {
      constructor() {
        this.storageKey = 'reports-notifications';
        this.button = document.getElementById('notification-toggle');
        this.enabled = false;
        this.audioContext = null;
        
        // Load saved preference
        try {
          const saved = localStorage.getItem(this.storageKey);
          this.enabled = saved === 'true';
        } catch (e) {
          console.warn('Unable to load notification preference:', e);
        }
        
        this.updateButton();
        this.button?.addEventListener('click', () => this.toggle());
      }
      
      toggle() {
        this.enabled = !this.enabled;
        this.updateButton();
        
        try {
          localStorage.setItem(this.storageKey, this.enabled.toString());
        } catch (e) {
          console.warn('Unable to save notification preference:', e);
        }
        
        // Play test sound when enabling
        if (this.enabled) {
          this.play();
        }
      }
      
      updateButton() {
        if (!this.button) return;
        this.button.classList.toggle('active', this.enabled);
        this.button.title = this.enabled ? 'Notifications enabled' : 'Notifications disabled';
        
        // Add slash through bell when disabled
        const svg = this.button.querySelector('svg');
        if (!svg) return;
        
        let slash = svg.querySelector('.slash-line');
        if (!this.enabled && !slash) {
          slash = document.createElementNS('http://www.w3.org/2000/svg', 'line');
          slash.setAttribute('class', 'slash-line');
          slash.setAttribute('x1', '3');
          slash.setAttribute('y1', '3');
          slash.setAttribute('x2', '21');
          slash.setAttribute('y2', '21');
          slash.setAttribute('stroke', 'currentColor');
          slash.setAttribute('stroke-width', '2');
          slash.setAttribute('stroke-linecap', 'round');
          svg.appendChild(slash);
        } else if (this.enabled && slash) {
          slash.remove();
        }
      }
      
      play() {
        if (!this.enabled) return;
        
        try {
          // Create audio context lazily (requires user interaction)
          if (!this.audioContext) {
            this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
          }
          
          const ctx = this.audioContext;
          const now = ctx.currentTime;
          
          // Create a pleasant notification sound (two-tone chime)
          const playTone = (frequency, startTime, duration, volume = 0.15) => {
            const oscillator = ctx.createOscillator();
            const gainNode = ctx.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(ctx.destination);
            
            oscillator.frequency.value = frequency;
            oscillator.type = 'sine';
            
            // Envelope for smooth sound
            gainNode.gain.setValueAtTime(0, startTime);
            gainNode.gain.linearRampToValueAtTime(volume, startTime + 0.01);
            gainNode.gain.exponentialRampToValueAtTime(0.01, startTime + duration);
            
            oscillator.start(startTime);
            oscillator.stop(startTime + duration);
          };
          
          // Two-tone chime: E5 -> A5
          playTone(659.25, now, 0.15, 0.12);  // E5
          playTone(880.00, now + 0.1, 0.25, 0.1);  // A5
          
        } catch (error) {
          console.warn('Unable to play notification sound:', error);
        }
      }
    }

    class ThemeController {
      constructor() {
        this.storageKey = 'reports-theme';
        this.button = document.getElementById('theme-toggle');
        this.prefQuery = window.matchMedia('(prefers-color-scheme: dark)');
        this.storageAvailable = this.checkStorage();
        this.hasExplicitPreference = false;
        this.currentTheme = null;

        const saved = this.storageAvailable ? localStorage.getItem(this.storageKey) : null;
        this.hasExplicitPreference = Boolean(saved);
        const initialTheme = saved || (this.prefQuery.matches ? 'dark' : 'light');
        this.apply(initialTheme, { persist: false });

        this.button?.addEventListener('click', () => this.toggle());

        const handlePrefChange = (event) => {
          if (this.hasExplicitPreference) return;
          this.apply(event.matches ? 'dark' : 'light', { persist: false });
        };

        if (typeof this.prefQuery.addEventListener === 'function') {
          this.prefQuery.addEventListener('change', handlePrefChange);
        } else if (typeof this.prefQuery.addListener === 'function') {
          this.prefQuery.addListener(handlePrefChange);
        }
      }

      checkStorage() {
        try {
          const testKey = '__theme_test__';
          localStorage.setItem(testKey, '1');
          localStorage.removeItem(testKey);
          return true;
        } catch (error) {
          console.warn('Theme storage unavailable:', error);
          return false;
        }
      }

      toggle() {
        const next = document.body.dataset.theme === 'dark' ? 'light' : 'dark';
        this.hasExplicitPreference = true;
        this.apply(next);
      }

      apply(theme, { persist = true } = {}) {
        document.body.dataset.theme = theme;
        document.documentElement.dataset.theme = theme;
        this.currentTheme = theme;
        if (this.button) {
          this.button.textContent = theme === 'dark' ? 'Light mode' : 'Dark mode';
        }
        if (persist && this.storageAvailable) {
          localStorage.setItem(this.storageKey, theme);
        }
        window.dispatchEvent(new CustomEvent(THEME_CHANGE_EVENT, { detail: theme }));
      }

      getCurrentTheme() {
        return this.currentTheme || document.body.dataset.theme || document.documentElement.dataset.theme || 'light';
      }
    }

    class ReportViewer {
      constructor(options) {
        this.pollInterval = options.pollInterval || 3000;
        this.reportListEl = document.getElementById('report-list');
        this.countEl = document.getElementById('report-count');
        this.lastUpdateEl = document.getElementById('last-update');
        this.mainHeaderEl = document.getElementById('main-header');
        this.activeReportEl = document.getElementById('active-report');
        this.renderedContentEl = document.getElementById('rendered-content');
        this.rawContentEl = document.getElementById('raw-content');
        this.toggleRawBtn = document.getElementById('toggle-raw');
        this.loadingIndicator = document.getElementById('loading-indicator');
        this.errorEl = document.getElementById('error-message');
        this.iconUnread = document.getElementById('icon-unread');
        this.iconRead = document.getElementById('icon-read');
        this.notificationSound = options.notificationSound;

        this.timer = null;
        this.knownReports = new Set();
        this.readReports = new Set();
        this.selectedReport = null;
        this.initialLoad = true;
        this.showingRaw = false;
        this.cachedContent = new Map(); // Cache for rendered and raw content
        this.newReports = new Set(); // Track newly added reports

        // Initialize with server-rendered reports
        const initialReports = this.reportListEl.querySelectorAll('.report');
        initialReports.forEach((el) => {
          const name = el.dataset.report;
          this.knownReports.add(name);
          this.readReports.add(name);
          el.addEventListener('click', () => this.selectReport(name));
        });

        if (initialReports.length > 0) {
          this.selectedReport = initialReports[0].dataset.report;
          this.loadReport(this.selectedReport);
          this.initialLoad = false;
        }

        this.toggleRawBtn.addEventListener('click', () => this.toggleRawView());

        // Update relative times initially and set up interval
        this.updateAllRelativeTimes();
        setInterval(() => this.updateAllRelativeTimes(), 5000);

        this.scheduleNextPoll();
      }

      scheduleNextPoll() {
        clearTimeout(this.timer);
        this.timer = setTimeout(() => this.pollReports(), this.pollInterval);
      }

      async pollReports() {
        try {
          this.errorEl.hidden = true;
          const response = await fetch('/api/reports');
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          
          const reports = await response.json();
          this.updateUI(reports);
        } catch (error) {
          console.error('Poll error:', error);
          this.errorEl.textContent = 'Unable to refresh reports: ' + error.message;
          this.errorEl.hidden = false;
        } finally {
          this.scheduleNextPoll();
        }
      }

      updateUI(reports) {
        this.countEl.textContent = reports.length;
        this.lastUpdateEl.textContent = 'just now';

        if (!reports.length) {
          this.renderEmptyState();
          this.renderedContentEl.innerHTML = '<div class="empty-state">No reports available</div>';
          this.activeReportEl.textContent = 'None';
          this.toggleRawBtn.style.display = 'none';
          this.knownReports = new Set();
          this.selectedReport = null;
          this.initialLoad = true;
          return;
        }

        this.clearEmptyState();

        const isInitialLoad = this.initialLoad;
        if (isInitialLoad) {
          reports.forEach((r) => this.readReports.add(r.filename));
          this.initialLoad = false;
        }

        const existingNodes = new Map();
        this.reportListEl.querySelectorAll('.report').forEach((el) => {
          existingNodes.set(el.dataset.report, el);
        });

        let hasNewReport = false;
        let anchor = null;

        reports.forEach((report) => {
          const isNew = !this.knownReports.has(report.filename);
          if (isNew && !isInitialLoad) {
            hasNewReport = true;
            this.newReports.add(report.filename);
          }

          let node = existingNodes.get(report.filename);
          if (!node) {
            node = this.createReportNode(report);
          } else {
            this.updateReportNode(node, report);
          }
          this.applyReadState(node, report.filename);
          
          // Apply highlight to new reports
          if (this.newReports.has(report.filename)) {
            node.classList.add('new-highlight');
            // Remove highlight class after animation completes
            setTimeout(() => {
              node.classList.remove('new-highlight');
              this.newReports.delete(report.filename);
            }, 30000);
          }

          const desiredNext = anchor ? anchor.nextSibling : this.reportListEl.firstChild;
          if (node !== desiredNext) {
            this.reportListEl.insertBefore(node, desiredNext);
          }

          anchor = node;
          existingNodes.delete(report.filename);
        });

        existingNodes.forEach((node) => node.remove());

        this.knownReports = new Set(reports.map((r) => r.filename));

        if (hasNewReport) {
          this.triggerHeaderPulse();
          this.notificationSound?.play();
        }

        if (!this.selectedReport || hasNewReport) {
          this.selectReport(reports[0].filename, { auto: true });
        }
      }

      createReportNode(report) {
        const article = document.createElement('article');
        article.className = 'report read';
        article.dataset.report = report.filename;
        article.dataset.timestamp = report.lastModified;

        const wrap = document.createElement('div');
        wrap.className = 'envelope-wrap';
        wrap.dataset.state = 'read';
        wrap.appendChild(this.iconRead.content.cloneNode(true));

        const info = document.createElement('div');
        info.className = 'report-info';

        const title = document.createElement('p');
        title.className = 'report-title';
        title.textContent = report.title;

        const meta = document.createElement('p');
        meta.className = 'report-meta';

        info.appendChild(title);
        info.appendChild(meta);

        article.appendChild(wrap);
        article.appendChild(info);

        article.addEventListener('click', () => this.selectReport(report.filename));

        return article;
      }

      updateReportNode(node, report) {
        const title = node.querySelector('.report-title');
        const meta = node.querySelector('.report-meta');
        if (title) title.textContent = report.title;
        if (node.dataset) node.dataset.timestamp = report.lastModified;
      }

      markAsRead(name) {
        if (this.readReports.has(name)) return;
        this.readReports.add(name);
        const node = this.reportListEl.querySelector(`.report[data-report="${CSS.escape(name)}"]`);
        if (node) this.applyReadState(node, name);
      }

      applyReadState(node, name) {
        const isRead = this.readReports.has(name);
        node.classList.toggle('read', isRead);
        node.classList.toggle('unread', !isRead);

        const wrap = node.querySelector('.envelope-wrap');
        if (!wrap) return;

        const currentState = wrap.dataset.state;
        const nextState = isRead ? 'read' : 'unread';
        if (currentState === nextState) return;

        wrap.dataset.state = nextState;
        wrap.innerHTML = '';
        const tpl = isRead ? this.iconRead : this.iconUnread;
        wrap.appendChild(tpl.content.cloneNode(true));
      }

      selectReport(name, { auto = false } = {}) {
        this.selectedReport = name;
        this.activeReportEl.textContent = name;
        this.toggleRawBtn.style.display = 'inline-block';

        if (!auto) {
          this.markAsRead(name);
        }

        this.reportListEl.querySelectorAll('.report').forEach((el) => {
          el.classList.toggle('active', el.dataset.report === name);
        });

        this.loadReport(name);
      }

      async loadReport(name) {
        // Show loading state
        this.loadingIndicator.style.display = 'inline-block';
        const activeWrapper = this.showingRaw ? this.rawContentEl : this.renderedContentEl;
        activeWrapper.classList.add('loading');

        try {
          // Check cache first
          if (!this.cachedContent.has(name)) {
            // Load both rendered and raw in parallel
            const [renderedResp, rawResp] = await Promise.all([
              fetch(`/api/reports/${encodeURIComponent(name)}`),
              fetch(`/api/reports/${encodeURIComponent(name)}/raw`)
            ]);

            if (!renderedResp.ok || !rawResp.ok) {
              throw new Error('Failed to load report');
            }

            const rendered = await renderedResp.text();
            const raw = await rawResp.text();

            this.cachedContent.set(name, { rendered, raw });
          }

          const content = this.cachedContent.get(name);

          // Update content
          setTimeout(() => {
            this.renderedContentEl.innerHTML = content.rendered;
            this.rawContentEl.textContent = content.raw;
            
            // Show with animation
            activeWrapper.classList.remove('loading');
            this.loadingIndicator.style.display = 'none';
          }, 150); // Small delay for smooth transition

        } catch (error) {
          console.error('Error loading report:', error);
          activeWrapper.innerHTML = `<div class="empty-state" style="color: var(--danger);">Error loading report: ${error.message}</div>`;
          activeWrapper.classList.remove('loading');
          this.loadingIndicator.style.display = 'none';
        }
      }

      toggleRawView() {
        this.showingRaw = !this.showingRaw;
        
        if (this.showingRaw) {
          this.renderedContentEl.classList.add('hidden');
          this.rawContentEl.classList.remove('hidden');
          this.toggleRawBtn.textContent = 'Show Rendered';
        } else {
          this.rawContentEl.classList.add('hidden');
          this.renderedContentEl.classList.remove('hidden');
          this.toggleRawBtn.textContent = 'Show Raw';
        }
      }

      triggerHeaderPulse() {
        const header = this.mainHeaderEl;
        if (!header) return;
        header.classList.remove('pulsing');
        void header.offsetWidth;
        header.classList.add('pulsing');
        header.addEventListener('animationend', () => {
          header.classList.remove('pulsing');
        }, { once: true });
      }

      renderEmptyState() {
        this.reportListEl.innerHTML = '<div class="empty-state">No reports yet. Generate one and it will appear here.</div>';
      }

      clearEmptyState() {
        const empty = this.reportListEl.querySelector('.empty-state');
        if (empty) empty.remove();
      }

      formatRelativeTime(value) {
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return value;

        const diffSeconds = Math.floor((Date.now() - date.getTime()) / 1000);
        const isPast = diffSeconds >= 0;
        const seconds = Math.abs(diffSeconds);
        if (seconds < 5) return 'just now';

        const fmt = (amount, unit) => {
          const plural = amount === 1 ? '' : 's';
          return isPast ? `${amount} ${unit}${plural} ago` : `in ${amount} ${unit}${plural}`;
        };

        if (seconds < 60) return fmt(seconds, 'second');
        const minutes = Math.floor(seconds / 60);
        if (minutes < 60) return fmt(minutes, 'minute');
        const hours = Math.floor(minutes / 60);
        if (hours < 24) return fmt(hours, 'hour');
        const days = Math.floor(hours / 24);
        if (days < 7) return fmt(days, 'day');
        const weeks = Math.floor(days / 7);
        if (weeks < 4) return fmt(weeks, 'week');
        return date.toLocaleDateString();
      }

      updateAllRelativeTimes() {
        const reports = this.reportListEl.querySelectorAll('.report');
        reports.forEach((report) => {
          const timestamp = report.dataset.timestamp;
          if (!timestamp) return;
          
          const meta = report.querySelector('.report-meta');
          if (!meta) return;
          
          const relativeTime = this.formatRelativeTime(timestamp);
          meta.textContent = relativeTime;
        });
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const themeController = new ThemeController();
      const notificationSound = new NotificationSound();
      new ReportViewer({
        pollInterval: 3000,
        notificationSound: notificationSound,
      });
    });
  </script>
  <script defer src="/js/report-theme.js"></script>
</body>
</html>
